name: Semver Label
on: workflow_call

jobs:
  check-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Check version labels
        id: check_labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get current version from latest tag via API (avoids needing checkout)
            let currentVersion = '0.1.0';
            try {
              const tags = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              if (tags.data.length > 0) {
                currentVersion = tags.data[0].name.replace(/^v/, '');
              }
            } catch (error) {
              console.log('No tags found, using default version 0.1.0');
            }

            console.log(`Current version: ${currentVersion}`);
            const [major, minor, patch] = currentVersion.split('.').map(Number);

            const response = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const versionLabels = ['patch', 'minor', 'major'];
            const foundVersionLabels = response.data
              .map(label => label.name.toLowerCase())
              .filter(name => versionLabels.includes(name));

            // Find any existing bot comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            let existingCommentId = null;
            for (const comment of comments.data) {
              if (comment.user.type === 'Bot' && comment.body.includes('### Version Label Status')) {
                existingCommentId = comment.id;
                break;
              }
            }

            // Calculate next version based on label
            function getNextVersion(label) {
              switch(label) {
                case 'major':
                  return `${major + 1}.0.0`;
                case 'minor':
                  return `${major}.${minor + 1}.0`;
                case 'patch':
                  return `${major}.${minor}.${patch + 1}`;
                default:
                  return currentVersion;
              }
            }

            // Build status message
            let status = '### Version Label Status\n\n';
            let shouldFail = false;

            if (foundVersionLabels.length === 0) {
              status += '⏳ **Waiting:** No version label found yet.\n\n' +
                       'This PR will default to a **patch** bump when merged.\n' +
                       'To specify a different version bump, add one of these labels:\n' +
                       '- `patch`: backwards-compatible bug fixes\n' +
                       '- `minor`: backwards-compatible features\n' +
                       '- `major`: breaking changes';
            } else if (foundVersionLabels.length > 1) {
              status += '❌ **Error:** Multiple version labels detected!\n\n' +
                       `Found labels: ${foundVersionLabels.map(l => `\`${l}\``).join(', ')}\n\n` +
                       'Please remove all but one version label. ' +
                       'Only one version type is allowed per PR.';
              shouldFail = true;
            } else {
              const labelType = foundVersionLabels[0];
              const nextVersion = getNextVersion(labelType);

              status += `✅ **Success:** Valid version label found: \`${labelType}\`\n\n`;
              status += 'This PR will trigger a version increment when merged:\n' +
                       `\`v${currentVersion}\` → \`v${nextVersion}\`\n\n`;

              switch(labelType) {
                case 'major':
                  status += '- **Major** version increment (breaking changes)';
                  break;
                case 'minor':
                  status += '- **Minor** version increment (new features, backwards compatible)';
                  break;
                case 'patch':
                  status += '- **Patch** version increment (bug fixes, backwards compatible)';
                  break;
              }
            }

            // Post or update status as comment
            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingCommentId,
                body: status
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: status
              });
            }

            // Set check conclusion
            if (shouldFail) {
              core.setFailed('Invalid version labeling');
            }
